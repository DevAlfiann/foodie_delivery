<script>
  // Tab Selector Interaction
  function selectTab(type) {
    const tabs = ['qr', 'card', 'ewallet'];
    tabs.forEach(t => {
      const el = document.getElementById('tab-' + t);
      if (t === type) {
        el.className = "flex-1 py-2 px-3 rounded-full bg-primary-container text-on-primary font-label-md text-label-md flex items-center justify-center gap-1.5 transition-all duration-200 shadow-sm";
      } else {
        el.className = "flex-1 py-2 px-3 rounded-full text-on-surface-variant hover:text-on-surface font-label-md text-label-md flex items-center justify-center gap-1.5 transition-all duration-200";
      }
    });

    if (type !== 'qr') {
      showToast('Switched payment channel to ' + type.toUpperCase());
    } else {
      showToast('Dynamic QRIS active');
    }
  }

  // Laser Scan-Line Micro Animation
  const scanline = document.getElementById('scanline');
  let scanPos = 16;
  let scanDirection = 1;
  setInterval(() => {
    scanPos += 1.8 * scanDirection;
    if (scanPos > 240) scanDirection = -1;
    if (scanPos < 14) scanDirection = 1;
    if (scanline) {
      scanline.style.top = scanPos + 'px';
    }
  }, 16);

  // QR Timer Countdown
  let secondsLeft = 298;
  const countdownEl = document.getElementById('countdown');
  setInterval(() => {
    if (secondsLeft > 0) {
      secondsLeft--;
      const mins = String(Math.floor(secondsLeft / 60)).padStart(2, '0');
      const secs = String(secondsLeft % 60).padStart(2, '0');
      if (countdownEl) countdownEl.innerText = mins + ':' + secs;
    }
  }, 1000);

  // Stamp Impact Bounce Animation
  function stampAgain() {
    const stamp = document.getElementById('bill-stamp');
    if (!stamp) return;
    stamp.style.transform = 'scale(2.4) rotate(0deg)';
    stamp.style.opacity = '0';
    setTimeout(() => {
      stamp.style.transform = 'scale(1) rotate(-12deg)';
      stamp.style.opacity = '1';
      showToast('Stamp verified by Foodie Pay!');
    }, 150);
  }

  function triggerPrintStamp() {
    stampAgain();
    showToast('Menyiapkan file PDF Receipt...');
  }

  function downloadFeedback() {
    showToast('QR Code tersimpan di Galeri');
  }

  function shareFeedback() {
    showToast('Tautan QRIS disalin ke clipboard');
  }

  function showToast(msg) {
    const toast = document.getElementById('toast');
    const toastText = document.getElementById('toast-text');
    if (!toast || !toastText) return;
    toastText.innerText = msg;
    toast.style.opacity = '1';
    setTimeout(() => {
      toast.style.opacity = '0';
    }, 2400);
  }

  // Initial trigger for stamp
  setTimeout(stampAgain, 400);
</script></main>
